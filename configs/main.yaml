experiment_name: main_v1
seed: 1234
worker_model: WORKER_MODEL_NAME      # fill from configs/models.yaml
judge_model: JUDGE_MODEL_NAME
dataset:
  name: multihop_pools
  split: test
  n_questions: 250
  pool_sizes: [50, 200]
systems: [closed_book, rag, single_agent, single_agent_compressed, multi_agent]
budgets_tokens: [10000, 25000, 50000, 100000]
max_steps: 25
reserve_tokens: 10000       
concurrency: 8
spend_limit_usd: 150
rag:
  chunk_tokens: 300
  overlap_tokens: 50
  top_k: 8
multi_agent:
  n_workers: 4
  budget_split: {orchestrator: 0.15, workers: 0.70, synthesis: 0.15}